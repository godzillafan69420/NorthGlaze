<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    <title>House points</title>
</head>
<body class="app-shell">
    <div class="page-wrapper">
        <header class="topbar">
            <div class="brand-block">
                <h1>Division Points</h1>
            </div>

            <nav class="main-nav">
                <a href="/" class="nav-link">Home</a>
                <a href="/edit" class="nav-link">Edit Score</a>
                <a href="/add_events" class="nav-link">Add Event</a>

                {% if 'user' in session %}
                    <a class="nav-link user-pill">{{ session.get('user').get('username') }}</a>
                    <a href="/logout" class="nav-link">Logout</a>
                    <a href="/change_password" class="nav-link">Change Password</a>
                {% else %}
                    <a href="/login" class="nav-link login-link">Login</a>
                {% endif %}
            </nav>
        </header>

        <section class="three-column" aria-label="House scores">
            <div class="house-card south-card">
                <h2>South</h2>
                <p class="score-value">{{ house_points[0] }}</p>
            </div>
            <div class="house-card north-card">
                <h2>North</h2>
                <p class="score-value">{{ house_points[1] }}</p>
            </div>
            <div class="house-card west-card">
                <h2>West</h2>
                <p class="score-value">{{ house_points[2] }}</p>
            </div>
        </section>

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
